<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Leaflet elevation compatibility fixture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../dist/leaflet-elevation.css">
  <style>
    #map { height: 400px; }
    #elevation-div { height: 240px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="elevation-div"></div>
  <script type="module">
    const version = new URLSearchParams(location.search).get('leaflet') === '1' ? '1.9.4' : '2.0.0-beta.3';
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = `https://unpkg.com/leaflet@${version}/dist/leaflet.css`;
    document.head.append(css);
    const script = document.createElement('script');
    script.src = `https://unpkg.com/leaflet@${version}/dist/${version.startsWith('1.') ? 'leaflet.js' : 'leaflet-global.js'}`;
    await new Promise((resolve, reject) => {
      script.onload = resolve;
      script.onerror = reject;
      document.head.append(script);
    });
    const bundle = new URLSearchParams(location.search).get('bundle') === 'minified' ? '.min' : '';
    await import(`../../dist/leaflet-elevation${bundle}.js`);
    window.map = new (L.LeafletMap || L.Map)('map', { center: [45, 9], zoom: 12, renderer: new L.Canvas() });
    window.profile = new L.Control.Elevation({
      distanceMarkers: { lazy: false, distance: true, direction: true },
      edgeScale: { bar: true, icon: true, coords: true },
      hotline: 'elevation',
      height: 220,
      width: 700,
      srcFolder: new URL('../../dist/', location.href).href,
    }).addTo(map);
    window.track = {
      type: 'Feature',
      properties: { name: 'Compatibility' },
      geometry: { type: 'LineString', coordinates: [[9, 45, 0], [9.03, 45.01, 100], [9.06, 45.02, 50]] },
    };
    profile.load(JSON.stringify(track));
  </script>
</body>
</html>
